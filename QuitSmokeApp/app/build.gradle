plugins {
    id 'com.android.application'
}

def signingPropertiesFile = rootProject.file('signing.properties')
def signingProperties = new Properties()
def hasReleaseSigning = signingPropertiesFile.exists()
if (hasReleaseSigning) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'com.quitsmoke.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.quitsmoke.app"
        minSdk 24
        targetSdk 34
        versionCode 45
        versionName "5.8.2"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
